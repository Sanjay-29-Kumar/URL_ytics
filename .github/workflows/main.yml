name: URLytics CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Frontend
      - name: Build Frontend Image
        run: |
          docker build \
          --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
          -f Dockerfile.frontend \
          -t ${{ secrets.DOCKER_USERNAME }}/urlytics-frontend:latest .

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/urlytics-frontend:latest

      # Backend
      - name: Build Backend Image
        run: |
          docker build \
          -f server/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/urlytics-backend:latest .

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/urlytics-backend:latest

      # Deploy Frontend
      - name: Trigger Frontend Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

      # Deploy Backend
      - name: Trigger Backend Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
